name: NEXUS release (.deb + APT repo)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta, edge]
        default: beta

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg coreutils

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Build the NEXUS shell bundle
        run: |
          bun install --frozen-lockfile
          bun run build
          test -d dist/client && test -f dist/server/index.mjs

      - name: Derive version and channel
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="0.0.$(date +%Y%m%d%H%M)"; fi
          CH="${{ github.event.inputs.channel || 'stable' }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"

      - name: Assemble the nexus-shell .deb
        run: |
          BR="$PWD/.debroot"
          mkdir -p "$BR/opt/nexus/app/client" "$BR/opt/nexus/app/server" \
                   "$BR/etc/systemd/system" "$BR/etc/apt/sources.list.d" \
                   "$BR/usr/share/nexus" "$BR/usr/share/plymouth/themes" \
                   "$BR/etc/sudoers.d" "$BR/etc/calamares"
          cp -a distro/payload/opt/nexus/. "$BR/opt/nexus/"
          cp -a dist/client/. "$BR/opt/nexus/app/client/"
          cp -a dist/server/. "$BR/opt/nexus/app/server/"
          cp -a distro/payload/usr/share/plymouth/themes/. "$BR/usr/share/plymouth/themes/"
          cp -a distro/payload/usr/share/nexus/. "$BR/usr/share/nexus/"
          cp -a distro/payload/etc/systemd/system/. "$BR/etc/systemd/system/"
          cp -a distro/payload/etc/apt/. "$BR/etc/apt/"
          cp -a distro/payload/etc/calamares/. "$BR/etc/calamares/"
          chmod +x "$BR"/opt/nexus/*.sh
          sed -i "s/^NEXUS_VERSION=.*/NEXUS_VERSION=${{ steps.meta.outputs.version }}/;s/^NEXUS_CHANNEL=.*/NEXUS_CHANNEL=${{ steps.meta.outputs.channel }}/;s/^NEXUS_BASE=.*/NEXUS_BASE=ubuntu-24.04/" \
            "$BR/usr/share/nexus/release"
          SIZE=$(du -sk "$BR" | cut -f1)
          cat > "$BR/DEBIAN/control" <<EOF
          Package: nexus-shell
          Version: ${{ steps.meta.outputs.version }}-1
          Section: utils
          Priority: optional
          Architecture: all
          Installed-Size: $SIZE
          Depends: nodejs | nodejs-20, chromium-browser | chromium | epiphany-browser, cage, seatd, curl, sudo, plymouth, init-system-helpers
          Recommends: unattended-upgrades
          Maintainer: NEXUS CI <ci@nexusos.africa>
          Description: NEXUS OS desktop shell (kiosk session)
           The NEXUS graphical shell, served locally on 127.0.0.1:8080 and rendered
           full-screen in a kiosk browser under the cage Wayland compositor.
          EOF
          dpkg-deb --build --root-owner-group "$BR" "nexus-shell_${{ steps.meta.outputs.version }}-1_all.deb"

      - name: Import signing key
        env:
          # Same GPG key used by the old RPM pipeline — no new secret needed.
          NEXUS_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          NEXUS_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          if [ -z "$NEXUS_GPG_PRIVATE_KEY" ]; then
            echo "No signing key configured — producing an unsigned repo."
            exit 0
          fi
          printf '%s' "$NEXUS_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"
          gpg --armor --export "$KEYID" > nexus-archive-keyring.asc

      - name: Build the APT repository
        env:
          NEXUS_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          CH="${{ steps.meta.outputs.channel }}"
          SUITE="noble"
          DEST="repo/$CH"
          mkdir -p "$DEST/pool/main" "$DEST/dists/$CH/main/binary-amd64"
          cp nexus-shell_*.deb "$DEST/pool/main/"

          cd "$DEST"
          dpkg-scanpackages --arch amd64 pool /dev/null > dists/$CH/main/binary-amd64/Packages
          gzip -k9 dists/$CH/main/binary-amd64/Packages

          {
            echo "Origin: NEXUS OS"
            echo "Label: NEXUS OS ($CH)"
            echo "Suite: $CH"
            echo "Codename: $CH"
            echo "Architectures: amd64"
            echo "Components: main"
            echo "Date: $(date -Ru)"
            apt-ftparchive release dists/$CH
          } > dists/$CH/Release

          if [ -n "${KEYID:-}" ]; then
            gpg --batch --pinentry-mode loopback --passphrase "$NEXUS_GPG_PASSPHRASE" \
              --clearsign --digest-algo SHA256 -o dists/$CH/InRelease dists/$CH/Release
            gpg --batch --pinentry-mode loopback --passphrase "$NEXUS_GPG_PASSPHRASE" \
              --detach-sign --armor --digest-algo SHA256 -o dists/$CH/Release.gpg dists/$CH/Release
            cp "$OLDPWD/nexus-archive-keyring.asc" .
          fi
          cd "$OLDPWD"

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-repo-${{ steps.meta.outputs.channel }}
          path: repo/

      - name: Attach .deb to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-shell_*.deb
            repo/**/nexus-archive-keyring.asc
